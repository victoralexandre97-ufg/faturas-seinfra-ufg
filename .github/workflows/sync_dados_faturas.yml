name: Sync dados_faturas JSON

on:
  push:
    paths:
      - "dados_faturas.json"
      - "update_info.json"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify JSON structure
        run: |
          python - <<'PY'
          import json
          with open('dados_faturas.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          if not isinstance(data, list):
              raise SystemExit('dados_faturas.json must be a JSON array')
          print(f'OK: {len(data)} registros')
          PY

      - name: Commit if needed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dados_faturas.json update_info.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dados_faturas.json"
            git push
          fi
